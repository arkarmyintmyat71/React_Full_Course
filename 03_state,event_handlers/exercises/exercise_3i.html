<!DOCTYPE html>
<html>

<head>
    <title>exercise 3i,j,k,l,m</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            async function sendMessage() {
                if (isLoading || inputText === '') {
                    return;
                }

                setIsLoading(true);
                setInputText('');

                const newChatMessage = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    }
                ];
                setChatMessages([
                    ...newChatMessage,
                    {
                        message: 'Loading...',
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                ]);

                const response = await Chatbot.getResponseAsync(inputText);
                setChatMessages([
                    ...newChatMessage,
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);
                setIsLoading(false);
                
            }

            function handelKey(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
                else if (event.key === "Escape") {
                    setInputText('');
                }
            }

            return (
                <>
                    <input placeholder="Send a message to Chatbot" size="30" onChange={saveInputText} value={inputText} onKeyDown={handelKey} />
                    <button onClick={sendMessage}>Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) {
            //const message = props.message;
            //const sender = props.sender;

            return (
                <div>
                    {sender === "robot" && <img src="../images/robot.png" width="50" />}
                    {message}
                    {sender === "user" && <img src="../images/user.png" width="50" />}
                </div>
            );
        }

        function ChatMessages({ chatMessages }) {
            return (
                <>
                    {chatMessages.map((chatMessage) => {
                        return (
                            <ChatMessage
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        );
                    })}
                </>
            );
        };

        function App() {
            const [chatMessages, setChatMessages] = React.useState([
                {
                    message: "Hello Chatbot",
                    sender: "user",
                    id: crypto.randomUUID()
                },
                {
                    message: "Hello! How can I help you?",
                    sender: "robot",
                    id: crypto.randomUUID()
                },
                {
                    message: "can you get me todays date?",
                    sender: "user",
                    id: crypto.randomUUID()
                },
                {
                    message: "Today is September 27",
                    sender: "robot",
                    id: crypto.randomUUID()
                }
            ]);

            return (
                <>
                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />

                    <ChatMessages
                        chatMessages={chatMessages}
                    />
                </>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
