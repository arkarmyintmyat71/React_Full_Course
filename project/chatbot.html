<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
    <style>
        .send-button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
        }

        .chat-input {
            font-size: 15px;
            padding: 10px 20px;
            border-radius: 10px;
            border-width: 1px;
            margin-right: 7px;
            flex-grow: 1;
        }

        .chat-input-container {
            display: flex;
            margin-bottom: 60px;
        }

        .chat-message-user {
            display: flex;
            justify-content: end;
            align-items: start;
        }

        .chat-message-robot {
            display: flex;
            justify-content: start;
            align-items: start;
        }

        .chat-message-text {
            background-color: rgb(238, 238, 238);
            padding: 15px 20px;
            border-radius: 10px;
            max-width: 300px;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 20px;
        }

        .app-container {
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-messages-container {
            flex-grow: 1;
            margin-top: 20px;
            overflow: scroll;
            scrollbar-width: none;
        }

        .welcome-message {
            color: rgb(120, 120, 120);
            text-align: center;
        }

        .loading-spinner {
            height: 40px;
            margin: -15px;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function ChatInput({ chatMessages, setChatMessages }) {
            const [inputText, setInputText] = React.useState('');
            const [isLoading, setIsLoading] = React.useState(false);

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function handleKeyDown(event) {
                if (event.key === "Enter") {
                    sendMessage();
                } else if (event.key === "Escape") {
                    setInputText("");
                }
            }

            async function sendMessage() {
                if (isLoading || inputText === '') {
                    return;
                }

                setIsLoading(true);
                setInputText('');

                const newChatMessage = [
                    ...chatMessages,
                    {
                        message: inputText,
                        sender: "user",
                        id: crypto.randomUUID()
                    }
                ];

                setChatMessages([
                    ...newChatMessage,
                    {
                        message: <img src="images/loading-spinner.gif" className="loading-spinner" />,
                        sender: 'robot',
                        id: crypto.randomUUID()
                    }
                ]);

                const response =
                    await Chatbot.getResponseAsync(inputText);

                setChatMessages([
                    ...newChatMessage,
                    {
                        message: response,
                        sender: "robot",
                        id: crypto.randomUUID()
                    }
                ]);

                setIsLoading(false);
            }
            return (
                <div className="chat-input-container">
                    <input
                        placeholder="Send a message to Chatbot"
                        size="30"
                        onChange={saveInputText}
                        onKeyDown={handleKeyDown}
                        value={inputText}
                        className="chat-input"
                    />
                    <button className="send-button" onClick={sendMessage}>Send</button>
                </div>
            );
        }

        function ChatMessage({ message, sender }) {

            return (
                <div className={sender === "robot" ? "chat-message-robot" : "chat-message-user"}>
                    {sender === "robot" && <img src="images/robot.png" width="45" />}
                    <div className="chat-message-text">
                        {message}
                    </div>
                    {sender === "user" && <img src="images/user.png" width="45" />}
                </div>
            );
        }

        //AutoScroll function
        function useAutoScroll(dependencies) {
            const containerRef = React.useRef(null);

            React.useEffect(() => {
                containerRef.current.scrollTop = containerRef.current.scrollHeight;
            }, [dependencies]);

            return containerRef;
        }

        function ChatMessages({ chatMessages }) {
            const chatMessageRef = useAutoScroll([chatMessages]);

            return (
                <div className="chat-messages-container"
                    ref={chatMessageRef}>
                    {
                        chatMessages.map((chatMessage) => {
                            return (
                                <ChatMessage
                                    message={chatMessage.message}
                                    sender={chatMessage.sender}
                                    key={chatMessage.id}
                                />
                            );
                        })
                    }

                </div>
            );
        };

        function App() {
            const [chatMessages, setChatMessages] = React.useState([]);

            return (
                <div className="app-container">

                    {chatMessages.length === 0 && (
                        <p className="welcome-message">
                            Welcome to the chatbot project! Send a message using the textbox below.
                        </p>
                    )}

                    <ChatMessages
                        chatMessages={chatMessages}
                    />


                    <ChatInput
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}
                    />
                </div>
            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
