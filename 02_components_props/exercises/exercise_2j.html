<!DOCTYPE html>
<html>

<head>
    <title>Exercise 2j</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function ProductDetails({ name, price, discountPrice, imageSrc }) {
            return (
                <div>
                    <img src={imageSrc} width="150" />
                    <p>{name}</p>
                    {discountPrice ?
                        (
                            <>
                                <del>Price: ${price}</del>
                                <p>Discount Price: ${discountPrice}</p>
                            </>
                        ) :
                        (
                            <p>Price: ${price}</p>
                        )
                    }

                    <button>Add to Cart</button>
                </div>
            );
        }
        function App() {
            return (
                <>
                    <ProductDetails
                        imageSrc="../images/cotton-socks.png"
                        name="Cotton socks"
                        price="10.90"
                        discountPrice="5.45"
                    />
                    <ProductDetails
                        imageSrc="../images/tennis-balls.png"
                        name="Tennis balls"
                        price="6.00"
                    />
                    <ProductDetails
                        imageSrc="../images/plain-t-shirt.png"
                        name="Plain T-Shirt"
                        price="7.99"
                    />
                </>
            );
        }
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
