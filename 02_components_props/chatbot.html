<!DOCTYPE html>
<html>

<head>
    <title>Chatbot</title>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function ChatInput() {
            return (
                <>
                    <input placeholder="Send a message to Chatbot" size="30" />
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage({ message, sender }) {
            //const message = props.message;
            //const sender = props.sender;

            return (
                <div>
                    {sender === "robot" && <img src="images/robot.png" width="50" />}
                    {message}
                    {sender === "user" && <img src="images/user.png" width="50" />}
                </div>
            );
        }

        function App() {
            return (
                <>
                    <ChatInput />
                    <ChatMessage
                        message="Hello Chatbot"
                        sender="user"
                    />
                    <ChatMessage
                        message="Hello! How can I help you?"
                        sender="robot"
                    />
                </>
            );
        }
    
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
