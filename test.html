<!DOCTYPE html>
<html>

<head>
    <title>Time Counting</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .loginFormContainer {
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .inputText {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px 16px 8px 16px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function LoginForm() {
            return (
                <div className="loginFormContainer">
                    <h1>Welcome Back</h1>
                    <p>Sign in to your account</p>
                    <input className="inputText" type="email" placeholder="Email Address" />
                    <input className="inputText" type="password" placeholder="Password" />

                    <div>
                        <input type="checkbox" name="Remember me" />
                        <p>Forgot password?</p>
                    </div>

                    <button type="button">Sign In</button>
                </div>
            );
        }

        function App() {

            return (
                <div className="container">
                    <LoginForm />
                </div>
            );
        }
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
