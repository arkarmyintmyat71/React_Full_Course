<!DOCTYPE html>
<html>

<head>
    <title>testing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        .orders-container {
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid #ddd;
        }

        .table-head {
            background-color: #f5f5f5;
        }

        .table-head th {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .order-table td {
            padding: 16px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function App() {
            return (
                <>
                    <div className="orders-container">
                        <div className="header">
                            <h2>Your Orders</h2>
                        </div>

                        <table className="order-table">
                            <thead className="table-head">
                                <tr>
                                    <th>Order Placed</th>
                                    <th>Total</th>
                                    <th>Order ID</th>
                                </tr>
                            </thead>

                            <tbody>
                                {/* Orders will go here */}
                            </tbody>
                        </table>
                    </div>
                </>

            );
        }

        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
