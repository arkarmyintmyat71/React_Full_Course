<!DOCTYPE html>
<html>

<head>
    <title>exercise_4a</title>
    <style>
        .on-btn {
            background-color: rgb(25, 135,85);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        const button = (
            <button className="on-btn">ON</button>
        );
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(button);
    </script>
</body>

</html>
