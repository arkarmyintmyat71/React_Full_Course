<!DOCTYPE html>
<html>

<head>
    <title>Exercise 4d</title>
    <style>
        .login-input {
            width: 200px;
            padding: 10px 20px;
            border-radius: 10px;
            border-width: 1px;
            margin-bottom: 10px;
        }

        .loginButton {
            background-color: rgb(0, 123, 255);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin-right: 5px;
        }

        .signUpButton {
           background-color: rgb(0, 123, 255);
            color: white;
            margin-left: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px; 
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function LoginForm() {
            return (
                <>
                    <div>
                        <input className="login-input" type="email" placeholder="Email" />
                    </div>
                    <div>
                        <input className="login-input" type="password" placeholder="Password" />
                    </div>
                    <button className="loginButton">Login</button>
                    <button className="signUpButton">Sign Up</button>
                </>
            );
        }

        function App() {
            return (
                <>
                    <h2>Hello, welcome to my website</h2>
                    <LoginForm />
                </>
            );
        }
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
