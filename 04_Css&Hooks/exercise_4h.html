<!DOCTYPE html>
<html>

<head>
    <title>Exercise 4h,i</title>
    <style>
        body {
            margin-top: 0;
            margin-bottom: 0;
        }

        .container {
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }

        .button {
            background-color: rgb(25, 135, 84);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.6.4/babel.js"></script>
    <script type="text/babel">

        function App() {
            const [count, setCount] = React.useState(0);
            const buttonRef = React.useRef();

            function clickButton() {
                setCount(count + 1);
            }

            function resetButton() {
                setCount(0);
            }

            function autoButton() {
                setInterval(() => {
                    buttonRef.current.click();
                }, 1000);
            }

            return (
                <div className="container">
                    <button className="button" ref={buttonRef} onClick={clickButton}>Clicked {count} {count <= 1 ? "time" : "times"}</button>
                    <button className="button" onClick={resetButton}>Reset</button>
                    <button className="button" onClick={autoButton}>Auto Click</button>
                </div>
            );
        }
        const container = document.querySelector(".js-container");
        ReactDOM.createRoot(container).render(<App />);
    </script>
</body>

</html>
